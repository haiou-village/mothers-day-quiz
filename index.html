// Shuffle array
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<div class="opt-idx">${letters[i]}</div><div class="opt-txt">${opt.text}</div>`;
    btn.onclick = () => pick(btn, opt.gem, container);
    container.appendChild(btn);
  });

  const nx = document.getElementById('btnNext');
  nx.classList.remove('show');
  nx.textContent = idx === shuffledQuestions.length - 1 ? '查看結果 ✨' : '下一題 →';

  const card = document.getElementById('qCard');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'slideUp 0.4s cubic-bezier(0.4,0,0.2,1) both';
}

function pick(btn, gem, container) {
  container.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
  btn.classList.add('selected');
  curSel = gem;
  answered = true;
  document.getElementById('btnNext').classList.add('show');
}

function nextQ() {
  if (!answered || !curSel) return;
  scores[curSel]++;
  curQ++;
  if (curQ >= shuffledQuestions.length) showResult();
  else loadQ(curQ);
}

function showResult() {
  const winner = Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
  const r = gems[winner];

  // ── 計數器 +1 ──
  const COUNTER_KEY = 'seagull_quiz_count';
  const prev = parseInt(localStorage.getItem(COUNTER_KEY) || '0');
  localStorage.setItem(COUNTER_KEY, prev + 1);

  document.getElementById('quizPage').classList.remove('active');
  document.getElementById('resultPage').classList.add('active');

  const tagsHTML = r.tags.map(t =>
    `<span class="tag" style="background:${r.tagColor.bg};border-color:${r.tagColor.border};color:${r.tagColor.color}">${t}</span>`
  ).join('');

  // FB 活動貼文網址（請貼文發布後換成真實網址）
  const FB_POST_URL = 'https://www.facebook.com/Fishow/';

  document.getElementById('resultWrap').innerHTML = `
    <div class="gem-badge">
      <span class="gem-icon-big" style="--gem-glow:${r.color.glow}">${r.icon}</span>
    </div>
    <div class="result-card">
      <div class="result-top" style="background:${r.color.top}">
        <div class="result-label">你的媽媽是</div>
        <div class="result-name" style="color:${r.color.accent}">${r.name}</div>
        <div class="result-sub">${r.sub}</div>
      </div>
      <div class="result-body">
        <div class="tags">${tagsHTML}</div>
        <div class="result-desc">${r.desc}</div>
        <div class="product-rec" style="background:${r.prodBg};border-color:${r.prodBorder}">
          <h3 style="color:${r.color.accent}">🎁 母親節推薦商品｜<span style="color:var(--muted);font-weight:400;font-size:13px">${r.product}</span></h3>
          <p>${r.productDesc}</p>
        </div>

        <div class="steps-box">
          <div class="steps-box-title">🎀 領取神秘小禮，完成以下兩步驟</div>
          <div class="step-row">
            <div class="step-num-pill">1</div>
            <div class="step-txt">前往臉書貼文，留言「我媽媽是 <strong style="color:${r.tagColor.color}">${r.name}</strong>！」</div>
          </div>
          <div class="step-row">
            <div class="step-num-pill">2</div>
            <div class="step-txt">截圖留言畫面，傳送到 <a href="https://lin.ee/v4WQITv" target="_blank" style="color:#00b900;font-weight:700;">海鷗漁村 LINE 官方帳號</a></div>
          </div>
        </div>
        </div>

        <!-- 主要 CTA：去臉書留言 -->
        <a href="${FB_POST_URL}" target="_blank" class="cta-fb">📘 前往臉書貼文留言</a>

        <!-- 購買連結 -->
        <a href="https://m.ccat.com.tw/3443/ProductList" target="_blank" class="cta-shop">
          🛒 立即選購 → 海鷗漁村
        </a>

        <button class="cta-retry" onclick="retryQuiz()">再測一次</button>
        <div class="share-row">
          <button class="share-btn s-fb" onclick="shareFB()">📘 FB 分享</button>
          <button class="share-btn s-line" onclick="nativeShare('${r.name}','${r.sub}')">📤 分享</button>
          <button class="share-btn s-copy" onclick="copyLink()">🔗 複製連結</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('resultWrap').classList.add('show');
}

function retryQuiz() {
  Object.keys(scores).forEach(k => scores[k] = 0);
  curQ = 0; curSel = null; answered = false;
  document.getElementById('resultPage').classList.remove('active');
  document.getElementById('resultWrap').classList.remove('show');
  document.getElementById('resultWrap').innerHTML = '';
  document.getElementById('quizPage').classList.add('active');
  loadQ(0);
}

function shareFB() {
  const url = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent('https://haiou-village.github.io/mothers-day-quiz');
  window.open(url, '_blank');
}

function shareLINE(name, sub) {
  // 使用手機原生分享，fallback 到 LINE 官方帳號
  const shareText = `我測出來了！我媽媽是「${name}」—— ${sub}。快來測測你的媽媽是哪顆寶石 💎\nhttps://haiou-village.github.io/mothers-day-quiz`;
  if (navigator.share) {
    navigator.share({
      title: '媽媽是哪顆寶石？｜海鷗漁村母親節',
      text: shareText,
      url: 'https://haiou-village.github.io/mothers-day-quiz'
    }).catch(() => {
      window.open('https://lin.ee/v4WQITv', '_blank');
    });
  } else {
    window.open('https://lin.ee/v4WQITv', '_blank');
  }
}

function nativeShare(name, sub) {
  const shareText = `我測出來了！我媽媽是「${name}」—— ${sub}。快來測測你的媽媽是哪顆寶石 💎`;
  if (navigator.share) {
    navigator.share({
      title: '媽媽是哪顆寶石？｜海鷗漁村母親節',
      text: shareText,
      url: 'https://haiou-village.github.io/mothers-day-quiz'
    });
  } else {
    copyLink();
  }
}

function copyLink() {
  navigator.clipboard.writeText('https://haiou-village.github.io/mothers-day-quiz').then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }).catch(() => {
    // fallback for older browsers
    const el = document.createElement('textarea');
    el.value = 'https://haiou-village.github.io/mothers-day-quiz';
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  });
}
</script>
</body>
</html>
